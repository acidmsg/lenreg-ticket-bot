<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />
    <meta name="color-scheme" content="light dark" />
    <meta name="app-version" content="6" />
    <title>Мониторинг врачей</title>
    <link rel="stylesheet" href="/static/app/vendor/vanilla-calendar.min.css" />
    <link rel="stylesheet" href="css/style.css?v=6" />
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script>
      // Тема применяется до первой отрисовки, чтобы не мигало: сохранённый режим
      // (system/dark/light), для системного — colorScheme Telegram, затем ОС.
      (function () {
        var STORAGE_KEY = "miniapp-theme";

        function storedMode() {
          try {
            var value = localStorage.getItem(STORAGE_KEY);
            return value === "dark" || value === "light" ? value : "system";
          } catch (error) {
            return "system";
          }
        }

        function systemTheme() {
          var tg = window.Telegram && window.Telegram.WebApp;
          if (tg && (tg.colorScheme === "light" || tg.colorScheme === "dark")) {
            return tg.colorScheme;
          }
          if (
            window.matchMedia &&
            window.matchMedia("(prefers-color-scheme: light)").matches
          ) {
            return "light";
          }
          return "dark";
        }

        function applyTheme() {
          var mode = storedMode();
          document.documentElement.dataset.themeMode = mode;
          document.documentElement.dataset.theme =
            mode === "system" ? systemTheme() : mode;
        }

        applyTheme();

        if (
          window.Telegram &&
          window.Telegram.WebApp &&
          window.Telegram.WebApp.onEvent
        ) {
          window.Telegram.WebApp.onEvent("themeChanged", applyTheme);
        }
      })();
    </script>
    <script src="/static/app/vendor/vanilla-calendar.min.js"></script>
  </head>
  <body>
    <div id="app"></div>
    <!-- components/*.js подключаются графом ES-модулей из js/app.js
         (в т.ч. components/filter-modal.js), отдельные теги не нужны -->
    <script src="/static/app/js/utils/escape.js"></script>
    <script src="/static/app/js/utils/doctor.js"></script>
    <script src="/static/app/js/utils/dom.js"></script>
    <script src="/static/app/js/utils/monitoring.js"></script>
    <script src="/static/app/js/utils/ui.js"></script>
    <script type="module" src="js/app.js?v=6"></script>
  </body>
</html>
