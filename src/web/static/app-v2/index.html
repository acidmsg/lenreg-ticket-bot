<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Запись к врачу</title>
    <meta http-equiv="refresh" content="0; url=/app/" />
    <script>
      // Старый адрес прототипа: сохраняем query и hash (в hash Telegram
      // передаёт tgWebAppData), иначе приложение откроется без initData.
      location.replace("/app/" + location.search + location.hash);
    </script>
  </head>
  <body>
    <p>Открываю приложение… <a href="/app/">Продолжить</a></p>
  </body>
</html>
