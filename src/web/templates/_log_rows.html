{# Строки витрины логов. Одна разметка на первый экран, подгрузку и слежение. #}
{% for record in records %}
<div class="log-row" role="row" title="Развернуть сообщение">
  <span class="log-cell log-time" role="cell">
    <span class="log-date">{{ record.ts.split(" ")[0] }}</span>
    <span class="log-clock">{{ record.ts.split(" ")[1] }}</span>
  </span>
  <span class="log-cell log-level level level--{{ record.level|lower }}" role="cell"
    >{{ record.level }}</span
  >
  <span class="log-cell log-source" role="cell" title="{{ record.source }}"
    >{{ record.source }}</span
  >
  <span class="log-cell log-message" role="cell">{{ record.message }}</span>
</div>
{% endfor %}
