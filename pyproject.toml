[project]
name = "lenreg-ticket-bot"
version = "1.0.0"
description = "Telegram-бот для мониторинга доступных талонов (слотов) на портале zdrav.lenreg.ru."
readme = "README.md"
requires-python = ">=3.11,<4.0"
license = "ISC"
authors = [
    { name = "acidmsg" }
]
keywords = ["telegram", "bot", "healthcare", "monitoring", "lenreg"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Healthcare Industry",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]

dependencies = [
    # === Core (Bot & Framework) ===
    "aiogram>=3.7,<4.0",
    # === Configuration ===
    "pydantic-settings>=2.0,<3.0",
    # === Logging ===
    "loguru>=0.7,<1.0",
    # === HTTP & Networking ===
    "httpx>=0.27,<1.0",
    # === Proxy support (SOCKS5) ===
    "aiohttp-socks>=0.9,<1.0",
    # === Data & Storage ===
    "aiofiles>=24.0,<26.0",
    "aiosqlite>=0.22,<1.0",
    "cachetools>=7.0,<8.0",
    "redis>=5.2,<9.0",
    # === Rate Limiting ===
    "aiolimiter>=1.1,<2.0",
    # === Web Dashboard (F5) ===
    "fastapi>=0.115,<1.0",
    "uvicorn[standard]>=0.34,<1.0",
    "jinja2>=3.1,<4.0",
    # === Date/Time utilities ===
    "python-dateutil>=2.9,<3.0",
    # === Error Notifications (M2) ===
    "sentry-sdk>=2.0,<3.0",
    # === Metrics & Monitoring ===
    "prometheus-client>=0.20,<1.0",
    # === File Locking (Cross-platform) ===
    "portalocker>=4.0,<5.0",
    # === Image Processing & PDF Export (Booking Export) ===
    "pillow>=11.0,<13.0",
    "reportlab>=4.0,<5.0",
    "python-barcode>=0.15.1,<1.0",
    "dnspython (>=2.8.0,<3.0.0)",
]

[tool.poetry]
package-mode = false

[tool.poetry.group.dev.dependencies]
# === Testing ===
pytest = ">=9.0,<10.0"
pytest-asyncio = ">=1.3,<2.0"
pytest-cov = ">=6.0,<8.0"
# === Linting & Formatting ===
ruff = ">=0.4,<1.0"
mypy = ">=1.10,<2.0"
types-aiofiles = ">=24.0,<26.0"
types-cachetools = ">=5.3,<8.0"
fakeredis = {extras = ["lua"], version = ">=2.30,<3.0"}
# === i18n ===
babel = ">=2.14,<3.0"
# === Pre-commit ===
pre-commit = ">=4.0,<5.0"
pre-commit-hooks = ">=6.0,<7.0"
types-python-dateutil = "^2.9.0.20260518"
# === Architecture linting ===
import-linter = ">=2.0,<3.0"
# === Code metrics ===
radon = ">=6.0,<7.0"
# === Dead code ===
vulture = ">=2.14,<3.0"

[tool.ruff]
src = ["src"]
target-version = "py311"
exclude = [".venv", "data", "logs"]

[tool.ruff.lint]
select = ["E", "F", "I", "W", "ASYNC", "N", "B", "UP", "SIM", "RUF", "C90", "PLR0913", "PLR0915"]
ignore = [
    "RUF001", # Разрешить кириллицу в обычных строках (String contains ambiguous Unicode character)
    "RUF002", # Разрешить кириллицу в докстрингах (Docstring contains ambiguous Unicode character)
    "RUF003", # Разрешить кириллицу в комментариях (Comment contains ambiguous Unicode character)
]

# Пороги сложности (источник: .roo/sessions/CODE_HEALTH_BASELINE.md).
# Блокирующий порог сложности считается ruff (C901); MI считает radon отдельно.
[tool.ruff.lint.mccabe]
max-complexity = 12

[tool.ruff.lint.pylint]
max-args = 5
max-statements = 50

# Ratchet: legacy-файлы с нарушениями на момент фиксации baseline (2026-10-11).
# Игнорируются только эти файлы и только указанные коды; новые нарушения в прочих
# файлах блокируются. Долги зарегистрированы в .roo/sessions/TECH_DEBT.md
# (TD-028..TD-031 и другие открытые записи). При устранении долга строку удалить.
[tool.ruff.lint.per-file-ignores]
"src/api/dns_fallback.py" = ["PLR0913"]
"src/api/zdrav_client.py" = ["C901", "PLR0915"]
"src/database/database.py" = ["PLR0913"]
"src/database/manager.py" = ["PLR0913"]
"src/database/repo_audit.py" = ["PLR0913"]
"src/database/repo_monitoring.py" = ["PLR0913"]
"src/database/repo_users.py" = ["PLR0913"]
"src/main.py" = ["PLR0913"]
"src/services/background.py" = ["C901", "PLR0913", "PLR0915"]
"src/services/doctor_discovery.py" = ["PLR0913"]
"src/services/log_reader.py" = ["PLR0913"]
"src/services/monitor.py" = ["C901", "PLR0913"]
"src/services/params.py" = ["C901"]
"src/services/patient_check.py" = ["PLR0913"]
"src/services/tools.py" = ["PLR0913"]
"src/services/user_actions.py" = ["PLR0913"]
"src/utils/helpers.py" = ["PLR0913"]
"src/utils/logging.py" = ["PLR0913"]
"src/utils/telegram_utils.py" = ["PLR0913"]
"src/web/export_token.py" = ["PLR0913"]
"src/web/routers/api.py" = ["PLR0913"]
"src/web/routers/backup_api.py" = ["C901", "PLR0915"]
"src/web/routers/export_api.py" = ["PLR0913"]
"src/web/routers/pages.py" = ["PLR0913"]
# Вне src/ новые правила также дали срабатывания на момент фиксации baseline —
# включены в ratchet, чтобы Phase 1 не добавляла новых отказов гейта.
"scripts/repair_booking_doctor.py" = ["PLR0913"]
"tests/conftest.py" = ["C901"]
"tests/services/test_monitor.py" = ["PLR0913"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

# Контракты архитектурных границ (Фаза 2). Запуск: lint-imports.
# Единственный источник истины о топологии — specs/ARCHITECTURE.md.
[tool.importlinter]
root_packages = ["src"]

[[tool.importlinter.contracts]]
name = "Database не зависит от верхних слоёв"
type = "forbidden"
source_modules = ["src.database"]
forbidden_modules = [
    "src.handlers",
    "src.web",
    "src.services",
    "src.middleware",
    "src.filters",
    "src.keyboards",
]

[[tool.importlinter.contracts]]
name = "Utils — самый нижний слой"
type = "forbidden"
source_modules = ["src.utils"]
forbidden_modules = [
    "src.services",
    "src.handlers",
    "src.web",
    "src.middleware",
    "src.filters",
    "src.keyboards",
    "src.database",
    "src.api",
    "src.assets",
]
[[tool.importlinter.contracts]]
name = "API-клиент не зависит от прикладных слоёв"
type = "forbidden"
source_modules = ["src.api"]
forbidden_modules = [
    "src.services",
    "src.handlers",
    "src.web",
    "src.middleware",
    "src.filters",
    "src.keyboards",
]
[[tool.importlinter.contracts]]
name = "Services не зависят от транспорта"
type = "forbidden"
source_modules = ["src.services"]
forbidden_modules = [
    "src.handlers",
    "src.web",
    "src.middleware",
    "src.filters",
    "src.keyboards",
]

[[tool.importlinter.contracts]]
name = "Handlers не зависят от web"
type = "forbidden"
source_modules = ["src.handlers"]
forbidden_modules = ["src.web"]

# Отчёт по мёртвому коду (Фаза 5). Неблокирующий: запуск через scripts/code_health.py.
[tool.vulture]
# Анализируется только src/: tests/ и scripts/ содержат вспомогательный код,
# который vulture ошибочно помечает как неиспользуемый.
paths = ["src"]
# __init__.py содержат реэкспорты (public API пакетов), которые vulture
# считает неиспользуемыми при импорте через пакет.
exclude = ["**/__init__.py"]
# 80 отсекает шум слабых срабатываний (weakly-private, unused properties).
min_confidence = 80
# Крупные находки первыми — информативнее для триажа.
sort_by_size = true

[tool.mypy]
# Таргет совпадает с рантаймом образа (python:3.12-slim). При 3.11 mypy не может
# разобрать стабы numpy 2.4 (PEP 695 `type X = ...`) и падает синтаксической
# ошибкой, скрывая остальные находки.
python_version = "3.12"
ignore_missing_imports = true
check_untyped_defs = true
explicit_package_bases = true
packages = ["src", "scripts", "tests"]
exclude = [".venv", "data", "logs"]
warn_return_any = true
warn_unused_ignores = true
show_error_codes = true

[[tool.mypy.overrides]]
module = "tests.handlers.test_registration"
disable_error_code = ["union-attr", "attr-defined"]
[[tool.mypy.overrides]]
module = "tests.handlers.test_common"
disable_error_code = ["union-attr", "attr-defined"]


[tool.pytest.ini_options]
minversion = "8.0"
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "-v",
    "--tb=short",
    "--strict-markers",
    # Гейт покрытия (Фаза 3): единый источник для Makefile, tasks.ps1, run_tests.py.
    # Фактическое покрытие на 2026-10-11: 71%.
    "--cov=src",
    "--cov-report=term-missing",
    "--cov-fail-under=50",
]
pythonpath = ["."]
filterwarnings = [
    # pytest-asyncio использует устаревшие asyncio.set_event_loop_policy /
    # get_event_loop_policy, удаляемые в Python 3.16 (известная проблема)
    "ignore::DeprecationWarning:pytest_asyncio.*",
    "ignore::pytest.PytestDeprecationWarning",
]
