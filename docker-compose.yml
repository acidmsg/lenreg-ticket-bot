services:
  # ===========================================================================
  # Redis — FSM-хранилище и кэш
  # ===========================================================================
  redis:
    image: redis:8-alpine
    container_name: lenreg_ticket_redis
    environment:
      - REDIS_PASSWORD=${REDIS_PASSWORD}
    command: redis-server --save 60 1 --loglevel warning --maxmemory 256mb --maxmemory-policy volatile-lru --requirepass ${REDIS_PASSWORD}
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    restart: always
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "$${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - lenreg_ticket_network
    deploy:
      resources:
        limits:
          memory: 256M
        reservations:
          memory: 128M

  # ===========================================================================
  # Qdrant — векторное хранилище для Codebase Indexing (только dev)
  # ===========================================================================
  qdrant:
    profiles:
      - dev
    image: qdrant/qdrant:v1.9.0
    container_name: lenreg_ticket_qdrant
    ports:
      - "127.0.0.1:6333:6333" # HTTP API
      - "127.0.0.1:6334:6334" # gRPC
    volumes:
      - qdrant_data:/qdrant/storage
    restart: unless-stopped
    networks:
      - lenreg_ticket_network
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 256M

  # ===========================================================================
  # Bot — Telegram-бот (aiogram polling)
  # ===========================================================================
  bot:
    # Образ собирается в CI (release.yml → GHCR) и деплоится как готовый артефакт:
    # локальная сборка на сервере отключена, чтобы прод получал ровно тот образ,
    # который прошёл проверки. Тег версии фиксируется в untracked .env
    # (BOT_IMAGE_TAG), откат — сменой тега. Локальная сборка при необходимости -
    # через docker-compose.dev.yml.
    image: ghcr.io/acidmsg/lenreg-ticket-bot:${BOT_IMAGE_TAG:-latest}
    container_name: lenreg_ticket_bot
    restart: unless-stopped
    user: "1000:1000"
    depends_on:
      redis:
        condition: service_healthy
    env_file:
      - .env
    # Часовой пояс контейнера: логи пишутся местным временем, поэтому
    # по умолчанию московское (переопределяется через TZ в .env).
    environment:
      TZ: ${TZ:-Europe/Moscow}
    # Пиннинг имени API-хоста: внутри контейнера имя разрешается в фиксированный
    # IP через /etc/hosts (SNI и заголовок Host сохраняются, TLS-сертификат
    # проверяется по имени). Сторонний DNS-резолвер в разрешении не участвует.
    # Значение переопределяется в untracked .env на сервере без правки репозитория.
    extra_hosts:
      - "zdrav.lenreg.ru:${API_PINNED_IP:-185.65.149.54}"
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
      # Секреты файлами (опция install.sh): <ПОЛЕ>_FILE в .env указывает на
      # /run/secrets/<name>. Каталог может быть пуст — тогда секреты в .env.
      - ./secrets:/run/secrets:ro
      # Скрипты (backup.sh, restore.sh, backup_healthcheck.sh) запечены в образ
      # через Dockerfile (COPY scripts/ scripts/). Bind-mount не используется,
      # чтобы пустая host-директория не затеняла baked-in скрипты.
      # Для dev-итерации можно временно раскомментировать:
      # - ./scripts:/app/scripts:ro
    healthcheck:
      # TD-014: единая проверка (процесс + Redis + HTTP-эндпоинты /metrics и
      # /login). REDIS_PASSWORD и WEB_DASHBOARD_* берутся из env_file .env.
      test: ["CMD", "/app/scripts/docker-healthcheck.sh"]
      interval: 30s
      timeout: 10s
      start_period: 90s
      retries: 3
    ports:
      - "127.0.0.1:9090:9090"
      # Публикация дашборда: loopback по умолчанию (публичный вход — отдельный
      # слой: cloudflared или caddy, см. профили ниже).
      # TD-035: origin публикуется только на loopback. Хостовый cloudflared
      # обращается к http://localhost:8080; резолв localhost зависит от /etc/hosts
      # и резолвера (127.0.0.1 или ::1), поэтому порт публикуется на обоих
      # loopback-адресах. Адреса переопределяются через .env (WEB_BIND_ADDR,
      # WEB_BIND_ADDR_V6); чтобы отключить IPv6-маппинг, значение меняют на
      # неиспользуемый loopback-адрес того же семейства вручную.
      - "${WEB_BIND_ADDR:-127.0.0.1}:${WEB_DASHBOARD_PORT:-8080}:8080"
      - "${WEB_BIND_ADDR_V6:-[::1]}:${WEB_DASHBOARD_PORT:-8080}:8080"
    networks:
      - lenreg_ticket_network
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M
        reservations:
          cpus: "0.25"
          memory: 128M

  # ===========================================================================
  # Caddy — reverse-proxy с автоматическим TLS (профиль caddy)
  # ===========================================================================
  # Публичный вход для машин без Cloudflare: Caddy сам получает сертификат
  # Let's Encrypt на CADDY_DOMAIN и проксирует на bot:8080 по внутренней сети.
  # Запускается только при COMPOSE_PROFILES=caddy.
  caddy:
    profiles:
      - caddy
    image: caddy:2-alpine
    container_name: lenreg_ticket_caddy
    restart: unless-stopped
    depends_on:
      - bot
    environment:
      CADDY_DOMAIN: ${CADDY_DOMAIN}
      CADDY_EMAIL: ${CADDY_EMAIL:-}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - lenreg_ticket_network

  # ===========================================================================
  # cloudflared — Cloudflare Tunnel (профиль cloudflared)
  # ===========================================================================
  # Публичный вход через Cloudflare: туннель в общей сети достаёт bot:8080
  # напрямую, порт на хост публиковать не нужно. Запускается только при
  # COMPOSE_PROFILES=cloudflared. Токен — CLOUDFLARE_TUNNEL_TOKEN из .env.
  cloudflared:
    profiles:
      - cloudflared
    image: cloudflare/cloudflared:latest
    container_name: lenreg_ticket_cloudflared
    restart: unless-stopped
    command: tunnel --no-autoupdate run --token ${CLOUDFLARE_TUNNEL_TOKEN}
    depends_on:
      - bot
    networks:
      - lenreg_ticket_network

volumes:
  redis_data:
    driver: local
  qdrant_data:
    driver: local
  caddy_data:
    driver: local
  caddy_config:
    driver: local

networks:
  lenreg_ticket_network:
    driver: bridge
